# nucs — production compose (spec 12.2). The app publishes port 8067 on the host
# (8067:8080). Tailscale / Cloudflare tunnels are NOT part of this stack: they are
# run externally by the user (own tunnel or reverse proxy) against that port. For
# LOCAL development/verification use docker-compose.dev.yml as an override —
# never in production.
#
# Usage:
#   docker compose up -d                                  # app on http://<host>:8067
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d   # dev only

name: nucs

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      COVERS_DIR: /data/covers
      FRONTEND_DIST: /app/static
      # The host path comes from ${MUSIC_LIBRARY_PATH} in the volume below;
      # inside the container the library always lives at the mount target /music.
      MUSIC_LIBRARY_PATH: /music
    expose:
      - "8080"
    ports:
      - "8067:8080"
    volumes:
      - nucs-data:/data
      - ${MUSIC_LIBRARY_PATH}:/music:ro
    tmpfs:
      - /tmp
    read_only: true
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health')"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - nucs-net

networks:
  nucs-net:
    driver: bridge

volumes:
  nucs-data:
